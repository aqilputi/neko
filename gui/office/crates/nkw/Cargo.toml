[package]
name = "nkw"
version = "0.1.0"
description = "nkw, the world: a nested Smithay compositor with windows as screens in a cozy 3D office"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nkw-core = { path = "../nkw-core" }
nkw-gl = { path = "../nkw-gl" }
calloop = "0.14.5"
glam = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nk-client = { path = "../nk-client" }
nk-cats = { path = "../nk-cats" }
nkw-objects = { path = "../nkw-objects" }
nkw-sys = { path = "../nkw-sys" }
wayland-client = "0.31"
smithay-client-toolkit = "0.21"
# wave 2b: each package appends its own deps, one per line, under its marker only
# P2
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# P3
# P4
# P5
# wave 4: one dep per line under your marker only
# W1
# W2
toml = "1"
# W3
# W4
# W5
# W6
# W7

[dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "24647fc8d00131eb7f388efed26e35ea316b0018" # re-pin by its own PR only
default-features = false
features = ["backend_winit", "renderer_glow", "wayland_frontend", "desktop"]

[dev-dependencies]
tempfile = "3"
