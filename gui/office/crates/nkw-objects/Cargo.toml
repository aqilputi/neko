[package]
name = "nkw-objects"
version = "0.1.0"
description = "nkw's pure world objects: acoustics, doors, vault, widgets, proximity, HUD badges, own sounds (no I/O)"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Dependency rule (docs/plano-mundo.md §2.11), checked by tests/deps.rs:
# only nkw-core, glam, serde.
[dependencies]
nkw-core = { path = "../nkw-core" }
glam = "0.33"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
