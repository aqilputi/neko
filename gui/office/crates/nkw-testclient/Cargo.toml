[package]
name = "nkw-testclient"
version = "0.1.0"
description = "nkw's test client: one xdg toplevel (solid colour or 1 px checker) that logs its Wayland events as JSON lines"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
wayland-client = "0.31"
smithay-client-toolkit = "0.21"
calloop = "0.14.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
