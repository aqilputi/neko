[package]
name = "nk-client"
version = "0.1.0"
description = "Client of the nekuroddo core (protocol v1): HTTP+JSON, SSE events, pane WebSockets, terminal emulation and key encoding"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
alacritty_terminal = "0.26"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
