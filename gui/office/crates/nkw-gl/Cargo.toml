[package]
name = "nkw-gl"
version = "0.1.0"
description = "nkw's world renderer: GLES 3.0 world pass, procedural cozy kit, offscreen target (no Wayland, no Smithay)"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Dependency rule (docs/plano-mundo.md §2.11), checked by tests/deps.rs:
# only glow, bytemuck, glam, nkw-core.
[dependencies]
glow = "0.16"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.33"
nkw-core = { path = "../nkw-core" }

[dev-dependencies]
khronos-egl = { version = "6", features = ["static"] }
png = "0.17"
serde_json = "1"
