[package]
name = "nkw-core"
version = "0.1.0"
description = "nkw's pure core: modes, camera, collision, layout, scheduler, hints (no Wayland, no GL, no I/O)"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Dependency rule (docs/plano-mundo.md §2.11), checked by tests/deps.rs:
# only nk-cats, glam, serde, serde_json, toml, nucleo-matcher.
[dependencies]
glam = "0.33"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
