[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# Bevy is heavy: optimize dependencies even in dev builds, keep our own code
# fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# the installed binary: no debug symbols (they are most of its size)
[profile.release]
strip = true
