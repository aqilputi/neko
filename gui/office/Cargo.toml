[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# Bevy is heavy: optimize dependencies even in dev builds, keep our own code
# fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# the installed binary: no debug symbols (they are most of its size)
[profile.release]
strip = true

# release/CI/perf only; the dev loop stays on `dev` (thin-LTO costs 54 s per incremental link)
[profile.world]
inherits = "release"
lto = "thin"
codegen-units = 1
strip = true

# Smithay's winit backend never emits `InputEvent::PointerMotion` at rev 24647fc8 (ANDAR's mouse-look needs
# it). The fork is that rev plus patches/smithay-winit-relative-pointer.patch (scripts/smithay-fork.sh rebuilds
# it); the nkw manifest keeps the upstream rev and only this section points at the fork, until upstream has it.
[patch."https://github.com/Smithay/smithay.git"]
smithay = { git = "https://github.com/aqilputi/smithay.git", rev = "ed6639e8fcd91d09b44598538b2bd13397a0b906" }
