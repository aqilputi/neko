# Orçamentos do nkw: espelho de docs/plano-mundo.md §1.3, uma seção por linha da tabela.
# Lido por world-perf.sh (subconjunto de TOML: chave = valor, listas de strings numa linha).
#
#   metric     o que o world-perf.sh mede (nome da chave no --json)
#   scenarios  cenários em que a linha vale ("bin" = o binário, conferido uma vez)
#   target     alvo (acima dele: "warn", passa)
#   fail       falha acima de (ausente: a linha não tem limite de falha)
#   gated      false = só relatado (o script não mede, ou o plano manda só relatar)
#   noise      piso absoluto da regressão: só falha se subir mais que max(noise, regression_pct)
#
# No --headless (llvmpipe) só os contadores (draws, triângulos, binário) falham pelo valor
# absoluto; o resto vale como regressão relativa à última medida headless (§1.4).

regression_pct = 20

# CPU ocioso | S1: NAV parado, 3 janelas, core demo com --reduced-motion | ≤ 0,1 % de um núcleo | 0,5 %
[cpu_idle]
metric = "cpu_pct"
scenarios = ["S1"]
target = 0.1
fail = 0.5
noise = 0.05

# wakeups ociosos | S1 | ≤ 1/s | 5/s
[wakeups_idle]
metric = "wakeups_per_s"
scenarios = ["S1"]
target = 1
fail = 5
noise = 0.5

# digitando no FOCO | S2: 15 teclas/s por --script | ≤ 1 % | 3 %
[cpu_typing]
metric = "cpu_pct"
scenarios = ["S2"]
target = 1
fail = 3
noise = 0.1

# mundo animado | S3: demo ocupado, 5 gatos ativos e 1 carteiro | ≤ 3 % | 6 %
[cpu_animated]
metric = "cpu_pct"
scenarios = ["S3"]
target = 3
fail = 6
noise = 0.2

# mundo animado com movimento reduzido | S3r | ≤ 0,5 % (plano §10, fase 2) | 3 %
[cpu_animated_reduced]
metric = "cpu_pct"
scenarios = ["S3r"]
target = 0.5
fail = 3
noise = 0.1

# CPU por quadro do mundo | S3/S4 | p50 ≤ 1 ms, p95 ≤ 2 ms | p95 3 ms
[frame_cpu_p50]
metric = "frame_p50_ms"
scenarios = ["S3", "S4"]
target = 1
noise = 0.1

[frame_cpu_p95]
metric = "frame_p95_ms"
scenarios = ["S3", "S4"]
target = 2
fail = 3
noise = 0.1

# S4d (onda 4): o S4 com clientes que repintam o buffer inteiro a cada quadro (o estresse do upload
# shm); o S4 passou a ter telas vivas de terminal (--damage 256x64). Só relatado.
[frame_cpu_stress_p50]
metric = "frame_p50_ms"
scenarios = ["S4d"]
target = 1
gated = false

[frame_cpu_stress_p95]
metric = "frame_p95_ms"
scenarios = ["S4d"]
target = 2
gated = false

# estágios do quadro (onda 4): a importação dos buffers dos clientes (shm/dmabuf) e a composição 2D,
# medidas à parte | só relatado
[frame_import]
metric = "import_p50_ms"
scenarios = ["S4", "S4d", "S5"]
gated = false

[frame_compose]
metric = "compose_p50_ms"
scenarios = ["S1", "S3", "S4", "S4d", "S5"]
gated = false

# telefone aberto | S7: Gatos no demo ocupado, j/k a cada 500 ms | composição p50 ≤ 1,5 ms | só relatado
[phone_compose]
metric = "compose_p50_ms"
scenarios = ["S7"]
target = 1.5
gated = false

# GPU por quadro | S4 a 1080p, MSAA 4x | ≤ 2 ms | 4 ms  (NKW_STATS=gpu: relatado, não barra)
[frame_gpu]
metric = "gpu_ms"
scenarios = ["S4"]
target = 2
fail = 4
gated = false

# câmera em movimento | S4: deslizes h/l a cada 1 s; S5: laço de ANDAR | 60 fps, 0 perdidos | 2 perdidos seguidos
# O resumo do NKW_STATS só dá o total de perdidos: 2 no total já falha (conservador).
[camera_dropped]
metric = "dropped"
scenarios = ["S4", "S5"]
target = 0
fail = 1

# latência de tecla | S2 | < 1 ms (mesma iteração do laço) | 1 quadro (16,7 ms a 60 Hz)
[key_latency]
metric = "key_latency_p95_ms"
scenarios = ["S2"]
target = 1
fail = 16.7
noise = 0.2

# RAM | partida sem janelas / 8 janelas | ≤ 90 MB / ≤ 110 MB RSS | 150 MB
# 45 → 90 (onda 3): só o Mesa já reside ≈ 48 MB (NKW_MEM=1: gpu_driver + gpu_buffers); o alvo
# antigo não era alcançável com GL no processo.
[ram_empty]
metric = "rss_mb"
scenarios = []
target = 90
fail = 150
gated = false

[ram_windows]
metric = "rss_mb"
scenarios = ["S1", "S2", "S3", "S4", "S4d", "S5", "S7"]
target = 110
fail = 150
noise = 5

# RAM com a biblioteca aberta | S6: fixture "big" (50k entradas), 3 estantes, 1 busca |
# ≤ S1 + 30 MB (S1 ≈ 100–110 MB: alvo 140) | só relatado nesta onda
[ram_library]
metric = "rss_mb"
scenarios = ["S6"]
target = 140
gated = false

# composições forçadas por mudança no HUD sem vontade (S14: o diálogo que parava) | relatado
[compose_hud_changes]
metric = "compose_hud_changes"
scenarios = ["S1", "S3", "S4", "S5", "S6"]
gated = false

# binário | release, stripped | ≤ 15 MB | 25 MB
[binary]
metric = "binary_mb"
scenarios = ["bin"]
target = 15
fail = 25
noise = 0.5

# partida | até o 1º quadro / até os gatos aparecerem | ≤ 250 ms / ≤ 1 s | 500 ms / 2 s
[startup_first_frame]
metric = "first_frame_ms"
scenarios = ["S1", "S2", "S3", "S4", "S5"]
target = 250
fail = 500
noise = 25

[startup_cats]
metric = "cats_ms"
scenarios = []
target = 1000
fail = 2000
gated = false

# build | release a frio / incremental (mexer no nkw-core) | ≤ 4 min / ≤ 15 s | 8 min / 30 s  (time cargo build)
[build_cold]
metric = "build_cold_s"
scenarios = []
target = 240
fail = 480
gated = false

[build_incremental]
metric = "build_incremental_s"
scenarios = []
target = 15
fail = 30
gated = false

# desenho | sala típica | ≤ 80 draw calls, ≤ 100k triângulos | 200 draws
[draws]
