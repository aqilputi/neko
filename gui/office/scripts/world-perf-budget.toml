scenarios = ["S1", "S3", "S4", "S5"]
target = 0.3
gated = false

# objetos: no máximo 4 vontades Rate simultâneas (P5, rate_wishes_max)
[rate_wishes]
metric = "rate_wishes_max"
scenarios = ["S1", "S3", "S4", "S5", "S6", "S7"]
target = 4
fail = 4
